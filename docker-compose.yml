name: stashernews

x-env_file: &env_file
  - path: .env.development
    required: true
  - path: .env.local
    required: false
# app/worker variant: additionally loads .env.production when the deploy shell
# exports NODE_ENV=production (later files override earlier ones, so prod URLs
# win over the dev defaults). In dev the interpolated path falls back to
# .env.development — a harmless no-op duplicate.
x-env_file_app: &env_file_app
  - path: .env.development
    required: true
  - path: .env.local
    required: false
  - path: .env.${NODE_ENV:-development}
    required: false
x-healthcheck: &healthcheck
  interval: 10s
  timeout: 10s
  retries: 10
  start_period: 1m
x-depends-on-db: &depends_on_db
  db:
    condition: service_healthy
    restart: true
x-depends-on-app: &depends_on_app
  app:
    condition: service_healthy
    restart: true


services:
  db:
    container_name: db
    build: ./docker/db
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck
      # readiness only: the app container runs `prisma migrate deploy`, which
      # creates the public schema (including users), and it depends_on this
      # service being healthy. A check that touches a migrated table (e.g. the
      # old `SELECT 1 FROM users`) deadlocks on a fresh volume — postgres is up
      # but no table exists until the app starts, which waits on this check.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -h 127.0.0.1"]
    expose:
      - "5432"
    ports:
      - "127.0.0.1:5431:5432"
    env_file: *env_file
    volumes:
      - db:/var/lib/postgresql/data
      - wal_archive:/wal-archive
    labels:
      CONNECT: "localhost:5431"
    cpu_shares: "${CPU_SHARES_IMPORTANT}"
    command:
      - postgres
      - -c
      - log_min_messages=notice
      - -c
      - log_error_verbosity=terse
      - -c
      - wal_level=replica
      - -c
      - 'archive_mode=${DB_ARCHIVE_MODE:-off}'
      - -c
      - 'archive_command=test ! -f /wal-archive/%f && cp %p /wal-archive/%f'
  app:
    container_name: app
    stdin_open: true
    tty: true
    build:
      context: ./
      args:
        - UID=${CURRENT_UID}
        - GID=${CURRENT_GID}
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/health"]
    depends_on: *depends_on_db
    env_file: *env_file_app
    expose:
      - "3000"
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
    labels:
      CONNECT: "localhost:3000"
    cpu_shares: "${CPU_SHARES_IMPORTANT}"
  capture:
    container_name: capture
    build:
      context: ./capture
    restart: unless-stopped
    depends_on: *depends_on_app
    profiles:
      - images
      - capture
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:5678/health"]
    # env-starved on purpose (audit B-1): capture used to inherit the FULL app
    # env (DATABASE_URL, MinIO root keys, opensearch admin password) — it needs
    # none of them, and a browser compromise should land on an empty env.
    environment:
      - CAPTURE_URL=http://stasher.news
      - NODE_ENV=${NODE_ENV:-development}
      - NEXT_PUBLIC_MEDIA_URL=${NEXT_PUBLIC_MEDIA_URL:-}
      - MEDIA_URL_DOCKER=${MEDIA_URL_DOCKER:-}
      - CAPTURE_MEDIA_TOKEN=${CAPTURE_MEDIA_TOKEN:-}
    security_opt:
      - no-new-privileges:true
    expose:
      - "5678"
    ports:
      - "127.0.0.1:5678:5678"
    labels:
      CONNECT: "localhost:5678"
    cpu_shares: "${CPU_SHARES_LOW}"
  worker:
    container_name: worker
    build:
      context: ./worker
      args:
        - UID=${CURRENT_UID}
        - GID=${CURRENT_GID}
    restart: unless-stopped
    # the worker drains on SIGTERM for up to ~25s (boss.stop graceful timeout);
    # compose's default 10s SIGKILLs in-flight money jobs mid-drain
    stop_grace_period: 30s
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "find ${WORKER_HEARTBEAT_PATH:-/tmp/worker-heartbeat} -mmin -5 | grep -q . || exit 1"]
    depends_on:
      <<:
         - *depends_on_db
         - *depends_on_app
    env_file: *env_file_app
    volumes:
      - ./:/app
      - backups:/backups
      - masterkey_backups:/masterkey-backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - npm run worker:dev
    cpu_shares: "${CPU_SHARES_IMPORTANT}"
    networks:
      - default
      - domains-network
  imgproxy:
    container_name: imgproxy
    image: darthsim/imgproxy:v4.0.19
    profiles:
      - images
    healthcheck:
      <<: *healthcheck
      test: [ "CMD", "imgproxy", "health" ]
    restart: unless-stopped
    env_file: *env_file_app
    ports:
      - "127.0.0.1:3001:8080"
    expose:
      - "8080"
    labels:
      - "CONNECT=localhost:3001"
    cpu_shares: "${CPU_SHARES_LOW}"
  # Media uploads (S3): MinIO with its data dir on a docker volume.
  # Replaced localstack S3 on 2026-08-16: localstack community edition keeps
  # S3 objects in container-ephemeral storage (persistence is a paid-tier
  # feature), so every container restart silently wiped ALL user uploads.
  # MinIO root creds track the app's MEDIA_AWS_* env via interpolation
  # (falling back to the legacy AWS_* pair for pre-migration .env.locals),
  # so the presigned-POST signer and the server always agree per machine.
  minio:
    container_name: minio
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    restart: unless-stopped
    profiles:
      - images
    env_file: *env_file
    environment:
      MINIO_ROOT_USER: ${MEDIA_AWS_ACCESS_KEY_ID:-${AWS_ACCESS_KEY_ID:-minioadmin}}
      MINIO_ROOT_PASSWORD: ${MEDIA_AWS_SECRET_ACCESS_KEY:-${AWS_SECRET_ACCESS_KEY:-minioadmin}}
      # browser presigned-POST origins (dev is cross-origin; VPS uploads are
      # same-origin through the caddy /uploads proxy and never hit this)
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3000,https://stasher.news
    ports:
      # keeps the historical dev upload URL host/port (NEXT_PUBLIC_MEDIA_URL)
      - "127.0.0.1:4566:9000"
      # admin console, loopback only
      - "127.0.0.1:9001:9001"
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    labels:
      - "CONNECT=localhost:4566"
    cpu_shares: "${CPU_SHARES_LOW}"
  # one-shot: create the uploads bucket + anonymous-download policy (the
  # app's GET path serves objects publicly, mirroring the old
  # acl:public-read + localstack anonymous GET behavior)
  minio-init:
    container_name: minio-init
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    profiles:
      - images
    env_file: *env_file
    environment:
      MINIO_ROOT_USER: ${MEDIA_AWS_ACCESS_KEY_ID:-${AWS_ACCESS_KEY_ID:-minioadmin}}
      MINIO_ROOT_PASSWORD: ${MEDIA_AWS_SECRET_ACCESS_KEY:-${AWS_SECRET_ACCESS_KEY:-minioadmin}}
    entrypoint: >
      /bin/sh -c "
      mc alias set sn http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
      mc mb --ignore-existing sn/$${NEXT_PUBLIC_AWS_UPLOAD_BUCKET:-uploads} &&
      printf '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Principal\":{\"AWS\":[\"*\"]},\"Action\":[\"s3:GetObject\"],\"Resource\":[\"arn:aws:s3:::%s/*\"]}]}' \"$${NEXT_PUBLIC_AWS_UPLOAD_BUCKET:-uploads}\" > /tmp/anon-get.json &&
      mc anonymous set-json /tmp/anon-get.json sn/$${NEXT_PUBLIC_AWS_UPLOAD_BUCKET:-uploads} &&
      echo 'minio uploads bucket ready (anonymous GET only, no listing)'
      "
  # ACM emulation only (custom-domains dev flow). S3 moved to the minio
  # service above; localstack keeps no host port.
  aws:
    container_name: aws
    image: localstack/localstack:4.12
    restart: unless-stopped
    profiles:
      - domains
    env_file: *env_file
    environment:
      - SERVICES=acm
    expose:
      - "4566"
    cpu_shares: "${CPU_SHARES_LOW}"
  opensearch:
    image: opensearchproject/opensearch:3.3.0
    container_name: opensearch
    profiles:
      - search
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "curl -ku admin:${OPENSEARCH_INITIAL_ADMIN_PASSWORD} --silent --fail localhost:9200/_cluster/health || exit 1"]
    restart: unless-stopped
    env_file: *env_file
    environment:
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_PASSWORD}
      - NODE_ENV=${NODE_ENV:-development}
      - plugins.security.disabled=true
      - discovery.type=single-node
      - "_JAVA_OPTIONS=${OPENSEARCH_JAVA_OPTS:--Xms2g -Xmx2g}"
    ports:
      - 127.0.0.1:9200:9200 # REST API
      - 127.0.0.1:9600:9600 # Performance Analyzer
    volumes:
      - os:/usr/share/opensearch/data
      - ./docker/opensearch/init-opensearch.sh:/usr/share/opensearch/init-opensearch.sh
      - ./docker/opensearch/seed-embeddings.gz:/usr/share/opensearch/seed-embeddings.gz:ro
    labels:
      CONNECT: "localhost:9200"
    command: ["bash", "/usr/share/opensearch/init-opensearch.sh"]
    cpu_shares: "${CPU_SHARES_LOW}"
  os-dashboard:
    image: opensearchproject/opensearch-dashboards:3.3.0
    container_name: os-dashboard
    restart: unless-stopped
    profiles:
      - search
    depends_on:
      opensearch:
        condition: service_healthy
        restart: true
    env_file: *env_file
    environment:
      - opensearch.ssl.verificationMode=none
      - OPENSEARCH_HOSTS=http://opensearch:9200
      - server.ssl.enabled=false
    ports:
      - 127.0.0.1:5601:5601
    links:
      - opensearch
    labels:
      CONNECT: "localhost:5601"
    cpu_shares: "${CPU_SHARES_LOW}"
  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog
    profiles:
      - email
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8025"]
    ports:
      - "8025:8025"
      # host SMTP port remapped: 1025 is often taken by host mail agents
      # (e.g. protonmail-bridge). the app still reaches mailhog via the
      # docker network (smtp://mailhog:1025), so only the published port changes.
      - "1026:1025"
    links:
      - app
    labels:
      CONNECT: "localhost:8025"
    cpu_shares: "${CPU_SHARES_LOW}"
  dnsmasq:
    image: 4km3/dnsmasq:2.90-r3
    profiles:
      - domains
    container_name: dnsmasq
    restart: unless-stopped
    ports:
      - "53530:53/tcp"
      - "53530:53/udp"
    command:
      - --no-daemon
      # Wildcard A records for dev test TLDs. Both .sndev and .test are RFC
      # 2606 / 6761 reserved (.test) or invented for sndev (.sndev), so they
      # never collide with real internet hostnames. Pair with macOS
      # /etc/resolver/<tld> to get zero-/etc/hosts dev DNS.
      - --address=/.sndev/127.0.0.1
      - --address=/.test/127.0.0.1
      - --conf-file=/etc/dnsmasq.conf
      - --conf-dir=/etc/dnsmasq.d
    volumes:
      - ./docker/dnsmasq/dnsmasq.conf:/etc/dnsmasq.conf
      - ./docker/dnsmasq/dnsmasq.d:/etc/dnsmasq.d
    cpu_shares: "${CPU_SHARES_LOW}"
    networks:
      domains-network:
        ipv4_address: 172.30.0.2
  caddy:
    # ALB-equivalent: terminates TLS for custom domains and forwards plain
    # HTTP to the next.js app, so dev mirrors the prod traffic shape and
    # browsers treat custom domains as secure contexts.
    image: caddy:2.10-alpine
    container_name: caddy
    profiles:
      - domains-caddy
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
        restart: true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # dev default; prod deploys set CADDYFILE=./docker/caddy/Caddyfile.prod
      - ${CADDYFILE:-./docker/caddy/Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cpu_shares: "${CPU_SHARES_LOW}"
  monerod:
    build: ./docker/monerod
    restart: unless-stopped
    env_file: *env_file
    command:
      - --non-interactive
      - --rpc-bind-ip=0.0.0.0
      - --restricted-rpc
      - --rpc-ssl=disabled
      - --disable-rpc-ban
      - --zmq-rpc-bind-ip=0.0.0.0
      - --confirm-external-bind
      - --confirm-zmq-rpc-external-bind
      # pruned from the start of the sync: stagenet chain ~7 GB -> ~1 GB,
      # mainnet ~160 GB -> fits the current tier. Wallet ops (view-key
      # scanning + sending) work on pruned nodes by design.
      - --prune-blockchain
      - --sync-pruned-blocks
    volumes:
      - monerod:/root/.bitmonero
    ports:
      - "127.0.0.1:${MONEROD_RPC_PORT:-38081}:${MONEROD_RPC_PORT:-38081}"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:${MONEROD_RPC_PORT:-38081}/get_height || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - default
    profiles:
      - monero
  monero-lws:
    build: ./docker/monero-lws
    depends_on:
      - monerod
    restart: unless-stopped
    env_file: *env_file
    command:
      - --rest-server=https://0.0.0.0:8443
      - --admin-rest-server=https://0.0.0.0:8081/admin
      - --rest-ssl-key=/keys/lws.key
      - --rest-ssl-certificate=/keys/lws.crt
      - --auto-accept-creation
      - --max-subaddresses=50000
      - --create-queue-max=50000
      - --access-control-origin=stasher.news
      - --confirm-external-bind
      - --webhook-ssl-verification=${MONERO_LWS_WEBHOOK_SSL_VERIFICATION:-none}
      - --exchange-rate-interval=0
      - --log-level=4
    volumes:
      - monerolws:/home/monero-lws
      - ${LWS_KEYS_VOLUME:-lws-keys:/keys}
    healthcheck:
      test: ["CMD-SHELL", "curl -sk -o /dev/null https://127.0.0.1:8443/login || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - default
    profiles:
      - monero

volumes:
  db:
  os:
  minio:
  backups:
  masterkey_backups:
  wal_archive:

  dnsmasq:
  caddy_data:
  caddy_config:
  monerod:
  monerolws:
  lws-keys:

networks:
  default: {}
  domains-network:
    name: domains-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24