name: stashernews

x-env_file: &env_file
  - path: .env.development
    required: true
  - path: .env.local
    required: false
# app/worker variant: additionally loads .env.production when the deploy shell
# exports NODE_ENV=production (later files override earlier ones, so prod URLs
# win over the dev defaults). In dev the interpolated path falls back to
# .env.development — a harmless no-op duplicate.
x-env_file_app: &env_file_app
  - path: .env.development
    required: true
  - path: .env.local
    required: false
  - path: .env.${NODE_ENV:-development}
    required: false
x-healthcheck: &healthcheck
  interval: 10s
  timeout: 10s
  retries: 10
  start_period: 1m
x-depends-on-db: &depends_on_db
  db:
    condition: service_healthy
    restart: true
x-depends-on-app: &depends_on_app
  app:
    condition: service_healthy
    restart: true


services:
  db:
    container_name: db
    build: ./docker/db
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck
      # readiness only: the app container runs `prisma migrate deploy`, which
      # creates the public schema (including users), and it depends_on this
      # service being healthy. A check that touches a migrated table (e.g. the
      # old `SELECT 1 FROM users`) deadlocks on a fresh volume — postgres is up
      # but no table exists until the app starts, which waits on this check.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -h 127.0.0.1"]
    expose:
      - "5432"
    ports:
      - "127.0.0.1:5431:5432"
    env_file: *env_file
    volumes:
      - db:/var/lib/postgresql/data
      - wal_archive:/wal-archive
    labels:
      CONNECT: "localhost:5431"
    cpu_shares: "${CPU_SHARES_IMPORTANT}"
    command:
      - postgres
      - -c
      - log_min_messages=notice
      - -c
      - log_error_verbosity=terse
      - -c
      - wal_level=replica
      - -c
      - 'archive_mode=${DB_ARCHIVE_MODE:-off}'
      - -c
      - 'archive_command=test ! -f /wal-archive/%f && cp %p /wal-archive/%f'
  app:
    container_name: app
    stdin_open: true
    tty: true
    build:
      context: ./
      args:
        - UID=${CURRENT_UID}
        - GID=${CURRENT_GID}
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/health"]
    depends_on: *depends_on_db
    env_file: *env_file_app
    expose:
      - "3000"
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
    labels:
      CONNECT: "localhost:3000"
    cpu_shares: "${CPU_SHARES_IMPORTANT}"
  capture:
    container_name: capture
    build:
      context: ./capture
    restart: unless-stopped
    depends_on: *depends_on_app
    profiles:
      - images
      - capture
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:5678/health"]
    # env-starved on purpose (audit B-1): capture used to inherit the FULL app
    # env (DATABASE_URL, MinIO root keys, opensearch admin password) — it needs
    # none of them, and a browser compromise should land on an empty env.
    environment:
      - CAPTURE_URL=http://stasher.news
      - NODE_ENV=${NODE_ENV:-development}
      - NEXT_PUBLIC_MEDIA_URL=${NEXT_PUBLIC_MEDIA_URL:-}
      - MEDIA_URL_DOCKER=${MEDIA_URL_DOCKER:-}
      - CAPTURE_MEDIA_TOKEN=${CAPTURE_MEDIA_TOKEN:-}
    security_opt:
      - no-new-privileges:true
    expose:
      - "5678"
    ports:
      - "127.0.0.1:5678:5678"
    labels:
      CONNECT: "localhost:5678"
    cpu_shares: "${CPU_SHARES_LOW}"
  worker:
    container_name: worker
    build:
      context: ./worker
      args:
        - UID=${CURRENT_UID}
        - GID=${CURRENT_GID}
    restart: unless-stopped
    # the worker drains on SIGTERM for up to ~25s (boss.stop graceful timeout);
    # compose's default 10s SIGKILLs in-flight money jobs mid-drain
    stop_grace_period: 30s
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "find ${WORKER_HEARTBEAT_PATH:-/tmp/worker-heartbeat} -mmin -5 | grep -q . || exit 1"]
    depends_on:
      <<:
         - *depends_on_db
         - *depends_on_app
    env_file: *env_file_app
    volumes:
      - ./:/app
      - backups:/backups
      - masterkey_backups:/masterkey-backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - npm run worker:dev
    cpu_shares: "${CPU_SHARES_IMPORTANT}"
    networks:
      - default
      - domains-network
  imgproxy:
    container_name: imgproxy
    image: darthsim/imgproxy:v4.0.19
    profiles:
      - images
    healthcheck:
      <<: *healthcheck
      test: [ "CMD", "imgproxy", "health" ]
    restart: unless-stopped
    env_file: *env_file_app
    ports:
      - "127.0.0.1:3001:8080"
    expose:
      - "8080"
    labels:
      - "CONNECT=localhost:3001"
    cpu_shares: "${CPU_SHARES_LOW}"
  # Media uploads (S3): SeaweedFS 4.48 all-in-one backend (master+volume+filer+
  # S3 in one process) reached ONLY through the `media` HTTP proxy below, on the
  # dedicated media-backend network. Replaced MinIO on 2026-10-24: MinIO
  # withdrew community distribution (the minio/minio Docker Hub repository was
  # removed, discovered 2026-10-22), leaving no trusted artifact and no
  # security-patch path. Backend credentials come from a rendered s3.config
  # (scripts/render-media-config.cjs) mounted read-only; the entrypoint fails
  # closed if it is missing. Pin: version tag + immutable index digest.
  seaweedfs:
    container_name: seaweedfs
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    restart: unless-stopped
    # Own `media` profile, NOT `images`: the VPS runs `images` (imgproxy) and
    # must not start this store until its migration is authorized — joining
    # `images` would make every routine VPS `up` require the external volume
    # and the rendered s3.config (pre-push review, 2026-10-25).
    profiles:
      - media
    entrypoint: ["/custom-entrypoint.sh"]
    volumes:
      - ./docker/seaweedfs/entrypoint.sh:/custom-entrypoint.sh:ro
      # Rendered before `up` (mkdir -p .media-runtime && chmod 700 &&
      # scripts/render-media-config.cjs .media-runtime/s3.config.json).
      # VPS: point MEDIA_S3_CONFIG at the operator path instead.
      - ${MEDIA_S3_CONFIG:-./.media-runtime/s3.config.json}:/run/seaweedfs-src/s3.config.json:ro
      - seaweedfs:/data
    healthcheck:
      # Any HTTP answer (including the unauthenticated 403 on /) proves the S3
      # API is serving; the start_period covers master raft re-election after
      # an unclean stop (~60s observed).
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:8333/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s
    stop_grace_period: 30s
    networks:
      - media-backend
    cpu_shares: "${CPU_SHARES_LOW}"
  # HTTP-only front door for the media backend. Keeps the app-facing S3
  # endpoint exactly where it was (host 127.0.0.1:4566, container media:9000)
  # and carries the legacy `minio` network alias so stored internal URLs of
  # the form http://minio:9000/uploads/<key> keep resolving — it runs no MinIO
  # software. Only HTTP S3 traffic is forwarded: master/filer/volume/gRPC
  # admin interfaces stay unreachable behind the media-backend network.
  media:
    container_name: media
    image: caddy:2.11.7-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    restart: unless-stopped
    profiles:
      - media
    depends_on:
      seaweedfs:
        condition: service_healthy
        restart: true
    read_only: true
    tmpfs:
      - /data
      - /config
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./docker/media/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      # keeps the historical dev upload URL host/port (NEXT_PUBLIC_MEDIA_URL)
      - "127.0.0.1:4566:9000"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      default:
        aliases:
          - minio
      media-backend: {}
    labels:
      - "CONNECT=localhost:4566"
    cpu_shares: "${CPU_SHARES_LOW}"
  # ACM emulation only (custom-domains dev flow). S3 moved to the media/
  # seaweedfs services above; localstack keeps no host port.
  aws:
    container_name: aws
    image: localstack/localstack:4.12
    restart: unless-stopped
    profiles:
      - domains
    env_file: *env_file
    environment:
      - SERVICES=acm
    expose:
      - "4566"
    cpu_shares: "${CPU_SHARES_LOW}"
  opensearch:
    image: opensearchproject/opensearch:3.3.0
    container_name: opensearch
    profiles:
      - search
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "curl -ku admin:${OPENSEARCH_INITIAL_ADMIN_PASSWORD} --silent --fail localhost:9200/_cluster/health || exit 1"]
    restart: unless-stopped
    env_file: *env_file
    environment:
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_PASSWORD}
      - NODE_ENV=${NODE_ENV:-development}
      - plugins.security.disabled=true
      - discovery.type=single-node
      - "_JAVA_OPTIONS=${OPENSEARCH_JAVA_OPTS:--Xms2g -Xmx2g}"
    ports:
      - 127.0.0.1:9200:9200 # REST API
      - 127.0.0.1:9600:9600 # Performance Analyzer
    volumes:
      - os:/usr/share/opensearch/data
      - ./docker/opensearch/init-opensearch.sh:/usr/share/opensearch/init-opensearch.sh
      - ./docker/opensearch/seed-embeddings.gz:/usr/share/opensearch/seed-embeddings.gz:ro
    labels:
      CONNECT: "localhost:9200"
    command: ["bash", "/usr/share/opensearch/init-opensearch.sh"]
    cpu_shares: "${CPU_SHARES_LOW}"
  os-dashboard:
    image: opensearchproject/opensearch-dashboards:3.3.0
    container_name: os-dashboard
    restart: unless-stopped
    profiles:
      - search
    depends_on:
      opensearch:
        condition: service_healthy
        restart: true
    env_file: *env_file
    environment:
      - opensearch.ssl.verificationMode=none
      - OPENSEARCH_HOSTS=http://opensearch:9200
      - server.ssl.enabled=false
    ports:
      - 127.0.0.1:5601:5601
    links:
      - opensearch
    labels:
      CONNECT: "localhost:5601"
    cpu_shares: "${CPU_SHARES_LOW}"
  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog
    profiles:
      - email
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8025"]
    ports:
      - "8025:8025"
      # host SMTP port remapped: 1025 is often taken by host mail agents
      # (e.g. protonmail-bridge). the app still reaches mailhog via the
      # docker network (smtp://mailhog:1025), so only the published port changes.
      - "1026:1025"
    links:
      - app
    labels:
      CONNECT: "localhost:8025"
    cpu_shares: "${CPU_SHARES_LOW}"
  dnsmasq:
    image: 4km3/dnsmasq:2.90-r3
    profiles:
      - domains
    container_name: dnsmasq
    restart: unless-stopped
    ports:
      - "53530:53/tcp"
      - "53530:53/udp"
    command:
      - --no-daemon
      # Wildcard A records for dev test TLDs. Both .sndev and .test are RFC
      # 2606 / 6761 reserved (.test) or invented for sndev (.sndev), so they
      # never collide with real internet hostnames. Pair with macOS
      # /etc/resolver/<tld> to get zero-/etc/hosts dev DNS.
      - --address=/.sndev/127.0.0.1
      - --address=/.test/127.0.0.1
      - --conf-file=/etc/dnsmasq.conf
      - --conf-dir=/etc/dnsmasq.d
    volumes:
      - ./docker/dnsmasq/dnsmasq.conf:/etc/dnsmasq.conf
      - ./docker/dnsmasq/dnsmasq.d:/etc/dnsmasq.d
    cpu_shares: "${CPU_SHARES_LOW}"
    networks:
      domains-network:
        ipv4_address: 172.30.0.2
  caddy:
    # ALB-equivalent: terminates TLS for custom domains and forwards plain
    # HTTP to the next.js app, so dev mirrors the prod traffic shape and
    # browsers treat custom domains as secure contexts.
    image: caddy:2.11.7-alpine
    container_name: caddy
    profiles:
      - domains-caddy
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
        restart: true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # dev default; prod deploys set CADDYFILE=./docker/caddy/Caddyfile.prod
      - ${CADDYFILE:-./docker/caddy/Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cpu_shares: "${CPU_SHARES_LOW}"
  monerod:
    build: ./docker/monerod
    restart: unless-stopped
    env_file: *env_file
    command:
      - --non-interactive
      - --rpc-bind-ip=0.0.0.0
      - --restricted-rpc
      - --rpc-ssl=disabled
      - --disable-rpc-ban
      - --zmq-rpc-bind-ip=0.0.0.0
      - --confirm-external-bind
      - --confirm-zmq-rpc-external-bind
      # pruned from the start of the sync: stagenet chain ~7 GB -> ~1 GB,
      # mainnet ~160 GB -> fits the current tier. Wallet ops (view-key
      # scanning + sending) work on pruned nodes by design.
      - --prune-blockchain
      - --sync-pruned-blocks
    volumes:
      - monerod:/root/.bitmonero
    ports:
      - "127.0.0.1:${MONEROD_RPC_PORT:-38081}:${MONEROD_RPC_PORT:-38081}"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:${MONEROD_RPC_PORT:-38081}/get_height || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - default
    profiles:
      - monero
  monero-lws:
    build: ./docker/monero-lws
    depends_on:
      - monerod
    restart: unless-stopped
    env_file: *env_file
    command:
      - --rest-server=https://0.0.0.0:8443
      - --admin-rest-server=https://0.0.0.0:8081/admin
      - --rest-ssl-key=/keys/lws.key
      - --rest-ssl-certificate=/keys/lws.crt
      - --auto-accept-creation
      - --max-subaddresses=50000
      - --create-queue-max=50000
      - --access-control-origin=stasher.news
      - --confirm-external-bind
      - --webhook-ssl-verification=${MONERO_LWS_WEBHOOK_SSL_VERIFICATION:-none}
      - --exchange-rate-interval=0
      - --log-level=4
    volumes:
      - monerolws:/home/monero-lws
      - ${LWS_KEYS_VOLUME:-lws-keys:/keys}
    healthcheck:
      test: ["CMD-SHELL", "curl -sk -o /dev/null https://127.0.0.1:8443/login || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - default
    profiles:
      - monero

volumes:
  db:
  os:
  seaweedfs:
  backups:
  masterkey_backups:
  wal_archive:

  dnsmasq:
  caddy_data:
  caddy_config:
  monerod:
  monerolws:
  lws-keys:

networks:
  default: {}
  # Dedicated network for the media backend; only the `media` proxy is a peer,
  # so app-network containers can never reach SeaweedFS control/gRPC ports.
  media-backend:
    name: media-backend
    internal: true
  domains-network:
    name: domains-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24