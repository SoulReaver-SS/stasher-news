name: Security
on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.4"
          cache: 'npm'
      - name: Install
        run: npm ci --legacy-peer-deps
      - name: Audit production dependencies (high+)
        run: npm audit --omit=dev --audit-level=high

  gitleaks:
    # Secret scan of new commits. Skips pull_request events: dependabot
    # branches fork from upstream history that predates the public baseline,
    # so a range scan there would just re-flag known-inherited upstream
    # fixtures instead of guarding this fork's new work.
    #
    # Deliberately runs the MIT-licensed gitleaks CLI instead of the
    # gitleaks-action wrapper: the wrapper requires organizations to carry a
    # GITLEAKS_LICENSE secret (free via gitleaks.io sign-up, but an external
    # dependency we don't want). Same scanner, no license.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # full history so the commit range below resolves
          fetch-depth: 0
      - name: Scan commits since the public-release baseline
        env:
          GITLEAKS_VERSION: '8.30.1'
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          # Everything up to f12dd9bf (the public-release baseline) was
          # manually audited on 2026-09-23: the older history only holds
          # upstream-inherited regtest fixtures and already-rotated dev
          # placeholder values. Scanning the full history on every run would
          # permanently flag those known-clean artifacts, so only commits
          # after the baseline are scanned. --redact keeps any finding masked
          # in this public repo's job logs.
          /tmp/gitleaks git --log-opts='f12dd9bf..HEAD' --redact
