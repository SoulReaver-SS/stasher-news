name: Lint Check
on: [pull_request]

jobs:
  lint-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.23.4"

      - name: Install
        run: npm install

      - name: Lint
        run: npm run lint
